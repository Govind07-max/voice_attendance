  name: voice_attendance
  description: "Smart Attendance Ubiquitous System — Teacher-centric voice-assisted attendance application."
  publish_to: 'none'
  version: 1.0.0+1

  environment:
    sdk: '^3.0.0'

  dependencies:
    flutter:
      sdk: flutter
    
    # State Management
    flutter_riverpod: ^2.5.1
    
    # Backend & Auth
    supabase_flutter: ^2.5.0
    
    # Speech Recognition
    speech_to_text: ^7.4.0
    permission_handler: ^11.0.0
    
    # Excel & File Handling
    file_picker: ^13.0.0
    excel: ^4.0.2
    
    # PDF Export
    pdf: ^3.10.8
    printing: ^5.12.0
    
    # Files & Sharing
    path_provider: ^2.1.0
    share_plus: ^13.0.0
    shared_preferences: ^2.3.0

    # Utilities & UI
    intl: ^0.19.0
    google_fonts: ^6.1.0
    uuid: ^4.3.3
    flutter_dotenv: ^5.1.0
    cupertino_icons: ^1.0.6
    fl_chart: ^1.3.1

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^3.0.0

  flutter:
    uses-material-design: true
    assets:
      - .env
      - assets/illustrations/
