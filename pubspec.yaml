name: voice_attendance
description: "Smart Attendance Ubiquitous System — Teacher-centric voice-assisted attendance application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Backend & Auth
  supabase_flutter: ^2.5.0
  
  # Speech Recognition
  speech_to_text: ^6.6.0
  
  # Excel & File Handling
  file_picker: ^8.0.0
  excel: ^4.0.2
  
  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
